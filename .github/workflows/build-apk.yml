name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build MotoDC Partner APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MotoDC-Partner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoDC-Partner-APK
          path: release-output/MotoDC-Partner.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.14
          name: "MotoDC Partner Android APK (v1.0.14)"
          body: |
            ## 🚀 MotoDC Partner Delivery App (Android APK v1.0.14)
            
            Download and install **MotoDC-Partner.apk** on any Android device.
            
            ### Fixes & Enhancements in v1.0.14:
            * 🏁 **Shift Logoff & Completion Native Notifications**: Native Android notifications and audio chime now fire when the shift ends (8:30 PM), when automatic logoff triggers, and when manual sign-out occurs.
            * ⚠️ **Shift Ending 15-Minute Advance Warning**: Push alert at 8:15 PM reminding riders to finish active handovers and return to Karaikal Hub.
            * ⏰ **Native OS-Level Shift Alarms (Works Even If App is Cleared/Closed)**: Registered 8:45 AM, 8:15 AM, and 8:30 PM alarms directly in Android system `AlarmManager` with `allowWhileIdle` (`RTC_WAKEUP`).
            * 📦 **Real-Time Package Notifications**: Native alerts, vibration, and audio chime when packages are assigned to your run sheet.
            * 🔍 **Doorstep Barcode Scanner**: Instant camera barcode scanning of parcel labels for rapid order verification at customer doorsteps.
          files: release-output/MotoDC-Partner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
