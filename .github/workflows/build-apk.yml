name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build MotoDC Partner APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MotoDC-Partner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoDC-Partner-APK
          path: release-output/MotoDC-Partner.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.11
          name: "MotoDC Partner Android APK (v1.0.11)"
          body: |
            ## 🚀 MotoDC Partner Delivery App (Android APK v1.0.11)
            
            Download and install **MotoDC-Partner.apk** on any Android device.
            
            ### Fixes & Enhancements in v1.0.11:
            * 🛡️ **Black Screen on Launch Fixed**: Removed stale Service Worker bundle caching and added React ErrorBoundary with automatic cache flusher.
            * ⚡ **Non-blocking Startup**: Notification channels and shift alerts initialize smoothly in background without blocking the UI.
            * 📦 **Real-Time Assigned Packages Notifications**: Instant native notification and audio chime when packages or corridors are assigned to your run sheet.
            * ⏰ **Shift Check-In Alarms & Notifications**: Daily automated alarms at 8:15 AM (check-in opens) and 8:45 AM (15-min warning before 9:00 AM late cutoff).
            * 🔔 **Live In-App Check-In Banner**: Visual alerts on the login screen highlighting remaining minutes to maintain punctuality bonus.
            * 🔒 **Customer-Only PIN Handover**: 4-digit PIN is strictly visible only to the recipient, fully hidden from the partner app.
            * 📍 **Battery-Efficient Fused GPS Tracking**: Continuous 10s ping active only on the road during package delivery runs.
          files: release-output/MotoDC-Partner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
