name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build MotoDC Partner APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MotoDC-Partner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoDC-Partner-APK
          path: release-output/MotoDC-Partner.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.1
          name: "MotoDC Partner Android APK (v1.0.1)"
          body: |
            ## 🚚 MotoDC Partner Delivery App (Android APK v1.0.1)
            
            Download and install **MotoDC-Partner.apk** on any Android device.
            
            ### What's New in v1.0.1:
            * 🎨 **New Luxury Automotive Brand Emblem**: Designed specifically for Android 8+ Adaptive Icons with obsidian black backing and glowing ruby winged shield.
            * ⚡ **Fixed Barcode Scanner Error**: Resolved Firebase permission block via dedicated high-speed serverless delivery API.
            * 🔄 **Scan Debounce & Pause**: Prevents repeated scan triggers on the same barcode; seamlessly resumes after package verification.
            * 📱 **In-Place Update Support**: Upgraded `versionCode 2` so you can tap "Update" directly over your existing install without uninstalling!
          files: release-output/MotoDC-Partner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
