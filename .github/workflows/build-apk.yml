name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build MotoDC Partner & Hub APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Partner App Dependencies
        run: npm install

      - name: Build Partner App Web Assets
        run: npm run build

      - name: Sync Partner App Capacitor Android
        run: npx cap sync android

      - name: Set Partner App gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Partner App Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Partner APK Asset
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MotoDC-Partner.apk

      - name: Install Hub App Dependencies & Build Web Assets
        run: |
          cd hub-app
          npm install
          npm run build
          npx cap sync android

      - name: Set Hub App gradlew executable
        run: chmod +x ./hub-app/android/gradlew

      - name: Build Hub App Android Debug APK
        run: |
          cd hub-app/android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Hub APK Asset
        run: |
          cp hub-app/android/app/build/outputs/apk/debug/app-debug.apk release-output/MotoDC-Hub.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotoDC-Android-APKs
          path: |
            release-output/MotoDC-Partner.apk
            release-output/MotoDC-Hub.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.28
          name: "MotoDC Android APKs (Partner & Hub v1.0.28)"
          body: |
            ## 🚀 MotoDC Android Apps (Partner & Hub v1.0.28)
            
            Download and install native Android APKs on any Android device:
            * **MotoDC-Partner.apk**: Dedicated app for delivery riders & couriers with native Android Foreground Service & AlarmManager background poller (receives urgent order assignment notifications even when locked, screen off, or cleared from recent tasks), live GPS route heartbeat, runsheet checklist, and doorstep handover verification.
            * **MotoDC-Hub.apk**: Dedicated warehouse fulfillment app for Karaikal Hub floor staff with real-time order queue (placed, confirmed, and auto-dispatched orders), assigned rider badges, high-speed camera barcode scanner, USB/Bluetooth barcode wedge scanner, and corridor rack staging.
          files: |
            release-output/MotoDC-Partner.apk
            release-output/MotoDC-Hub.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
