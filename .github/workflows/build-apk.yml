name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build MotoDC Partner APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MotoDC-Partner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoDC-Partner-APK
          path: release-output/MotoDC-Partner.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.16
          name: "MotoDC Partner Android APK (v1.0.16)"
          body: |
            ## 🚀 MotoDC Partner Delivery App (Android APK v1.0.16)
            
            Download and install **MotoDC-Partner.apk** on any Android device.
            
            ### Fixes & Enhancements in v1.0.16:
            * 🛠️ **Fixed Startup Error (`Camera is not defined`)**: Cleanly imported `Camera` icon across Daily Run Sheet and handover screens.
            * 📦 **Real-Time Background Package Assignment**: Root-level Firestore `onSnapshot` listener and smart diffing so riders receive instant system alerts when admin assigns parcels, without spurious popups on app entry.
            * 🔒 **Strict Hub Bag Loading Verification Gate**: Riders must scan 100% of assigned parcels into their delivery bag before departing Karaikal Hub. Destination maps, addresses, and live route GPS remain strictly locked until all parcels are verified.
            * 🎯 **Mandatory Doorstep Barcode Scan**: Tapping any assigned stop now opens the Barcode Scanner targeted to that specific order. Riders must scan the parcel's barcode at the doorstep; only an exact match unlocks the customer's 4-digit PIN handover.
            * 🏁 **Shift Logoff & Completion Native Notifications**: Native Android notifications and audio chime now fire when the shift ends (8:30 PM), when automatic logoff triggers, and when manual sign-out occurs.
          files: release-output/MotoDC-Partner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
