name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build MotoDC Partner APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MotoDC-Partner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoDC-Partner-APK
          path: release-output/MotoDC-Partner.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.9
          name: "MotoDC Partner Android APK (v1.0.9)"
          body: |
            ## 🚚 MotoDC Partner Delivery App (Android APK v1.0.9)
            
            Download and install **MotoDC-Partner.apk** on any Android device.
            
            ### What's New in v1.0.9:
            * 📦📦 **1-Scan Multi-Parcel Batch Handover (Enhancement 5)**: Streamlines bulk deliveries to mechanics, workshops, and multi-package customers!
            * 🛒 **Live Batch Tray & Consecutive Barcode Scan**: Scan multiple parcel boxes in continuous succession with haptic feedback without pausing.
            * 🔑 **1-Tap Combined PIN Verification**: Single 4-digit customer handover PIN confirms and grounds the entire consignment in one shot.
            * 💳 **Unified Batch COD & Dynamic UPI QR**: Merges multiple COD balances into a single combined cash/UPI collection.
            * 📶 **Offline-First Handover Sync (Enhancement 4)**: Apartment basements and zero-signal dead zones with auto-flushing queue.
            * 💰 **Driver Shift Drawer & Cash Settlement HUD (Enhancement 3)**: Banknote counter and live cash reconciliation.
            * 📱 **Doorstep Dynamic UPI QR Code (Enhancement 2)**: GPay/PhonePe/Paytm/BHIM QR generator.
            * 📍 **1-Tap Google Maps Navigation & WhatsApp 5-Min Alert (Enhancement 1)**.
          files: release-output/MotoDC-Partner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
