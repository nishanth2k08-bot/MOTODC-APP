name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build MotoDC Partner APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MotoDC-Partner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoDC-Partner-APK
          path: release-output/MotoDC-Partner.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.6
          name: "MotoDC Partner Android APK (v1.0.6)"
          body: |
            ## 🚚 MotoDC Partner Delivery App (Android APK v1.0.6)
            
            Download and install **MotoDC-Partner.apk** on any Android device.
            
            ### What's New in v1.0.6:
            * 📱 **Doorstep Dynamic UPI QR Code (Enhancement 2)**: Solves cash change headaches! Customers can scan an auto-generated NPCI QR code to pay exact amount using GPay, PhonePe, Paytm, BHIM, or Cred.
            * ⚡ **Zero-Discrepancy Shift Reconciliation**: Orders paid via doorstep UPI QR are automatically categorized separately from physical cash-in-hand.
            * 📊 **Shift HUD Dual Tally**: Real-time tracking of both Physical Cash and UPI digital settlements.
            * 📍 **1-Tap Google Maps & WhatsApp 5-Min Alert**: Turn-by-turn routing and pre-arrival alerts directly from route queue.
          files: release-output/MotoDC-Partner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
