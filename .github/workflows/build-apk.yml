name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build MotoDC Partner APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MotoDC-Partner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoDC-Partner-APK
          path: release-output/MotoDC-Partner.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.8
          name: "MotoDC Partner Android APK (v1.0.8)"
          body: |
            ## 🚚 MotoDC Partner Delivery App (Android APK v1.0.8)
            
            Download and install **MotoDC-Partner.apk** on any Android device.
            
            ### What's New in v1.0.8:
            * 📶 **Offline-First Handover Sync (Enhancement 4)**: Apartment basements, underground parking, elevators, and cellular dead zones are now 100% supported!
            * 💾 **Zero-Loss Local Queue**: Deliveries in zero-signal zones are safely saved in local queue (`offlineQueue`) without failing or blocking the driver.
            * ⚡ **Auto-Flushing Background Sync**: As soon as the driver enters cellular range, pending handovers automatically sync to the cloud.
            * 🔄 **1-Tap Manual Sync**: Header pill and route queue banner allow instant manual synchronization at any time.
            * 💰 **Driver Shift Drawer & Cash Settlement HUD (Enhancement 3)**: Banknote counter and live reconciliation.
            * 📱 **Doorstep Dynamic UPI QR Code (Enhancement 2)**: GPay/PhonePe/Paytm/BHIM QR generator.
            * 📍 **1-Tap Google Maps Navigation & WhatsApp 5-Min Alert (Enhancement 1)**.
          files: release-output/MotoDC-Partner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
