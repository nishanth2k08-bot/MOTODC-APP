name: Build MotoDC Hub APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build MotoDC Hub APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MotoDC-Hub.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoDC-Hub-APK
          path: release-output/MotoDC-Hub.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "MotoDC Hub Fulfillment Android APK (v1.0.0)"
          body: |
            ## 📦 MotoDC Hub Warehouse Fulfillment App (Android APK v1.0.0)
            
            Download and install **MotoDC-Hub.apk** on any Android device or warehouse scanning terminal.
            
            ### Features Included:
            * ⚡ Hardware USB & Bluetooth Barcode Scanner listener (Keyboard Wedge)
            * 📷 High-Speed Camera Barcode & QR Code Scanner (Rear Camera + Laser Reticle)
            * 📦 Real-time Firestore sync with COD & Prepaid Order Queues
            * 🏷️ Amazon-style Printable Shipping Labels with Code-128 & QR Code
            * 🗺️ 4-Corridor Geographic Rack Staging (CTC-01, NRC-02, SRC-03, WTC-04)
            * 🔒 Shift Lock Protection (Terminal PIN: 1234, 8:30 PM auto-lock)
          files: release-output/MotoDC-Hub.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
